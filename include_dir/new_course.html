<!DOCTYPE html>
<html lang="de" data-theme="htw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <title>HTW Lern</title>
</head>

<body class="flex flex-col gap-0 m-0 p-0 min-h-screen from-primary/20 to-secondary/20 bg-gradient-to-br">
    <div hx-get="/header" hx-swap="outerHTML" hx-trigger="load"></div>


    <div class="flex justify-center p-4 gap-4 grow">
        <div class="card card-border w-96 glass grow shadow justify-between" hx-swap="innerHTML" hx-get="feedback"
            hx-trigger="load">
        </div>
    </div>


</body>

</html>
